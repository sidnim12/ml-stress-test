[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-stress-test"
version = "0.1.0"
description = "Stress testing utilities for tabular ML models (noise, missingness, covariate shift, feature drop)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sidnim12" }]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn"
]

[tool.setuptools]
packages = ["ml_stress_test", "ml_stress_test.tests"]
